<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      .bar { fill: #00ff41; }
      @keyframes wave1  { 0%,100%{height:8px;y:56px}  50%{height:60px;y:30px} }
      @keyframes wave2  { 0%,100%{height:14px;y:53px} 50%{height:40px;y:40px} }
      @keyframes wave3  { 0%,100%{height:20px;y:50px} 50%{height:70px;y:25px} }
      @keyframes wave4  { 0%,100%{height:10px;y:55px} 50%{height:50px;y:35px} }
      @keyframes wave5  { 0%,100%{height:30px;y:45px} 50%{height:80px;y:20px} }
      @keyframes wave6  { 0%,100%{height:6px;y:57px}  50%{height:44px;y:38px} }
      @keyframes wave7  { 0%,100%{height:18px;y:51px} 50%{height:64px;y:28px} }
      @keyframes wave8  { 0%,100%{height:24px;y:48px} 50%{height:36px;y:42px} }
      @keyframes wave9  { 0%,100%{height:12px;y:54px} 50%{height:56px;y:32px} }
      @keyframes wave10 { 0%,100%{height:28px;y:46px} 50%{height:72px;y:24px} }
      @keyframes glow   { 0%,100%{opacity:0.6}        50%{opacity:1}          }
      .b1  { animation: wave1  1.2s ease-in-out infinite; }
      .b2  { animation: wave2  0.9s ease-in-out infinite 0.1s; }
      .b3  { animation: wave3  1.5s ease-in-out infinite 0.2s; }
      .b4  { animation: wave4  1.1s ease-in-out infinite 0.05s; }
      .b5  { animation: wave5  0.8s ease-in-out infinite 0.3s; }
      .b6  { animation: wave6  1.3s ease-in-out infinite 0.15s; }
      .b7  { animation: wave7  1.0s ease-in-out infinite 0.25s; }
      .b8  { animation: wave8  0.7s ease-in-out infinite 0.35s; }
      .b9  { animation: wave9  1.4s ease-in-out infinite 0.08s; }
      .b10 { animation: wave10 0.85s ease-in-out infinite 0.4s; }
      .glow { animation: glow 2s ease-in-out infinite; }
    </style>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="#000000" rx="8"/>

  <!-- Glow group -->
  <g filter="url(#glow-filter)" class="glow">
    <!-- Left bars -->
    <rect class="bar b5"  x="50"  y="45" width="8" height="30" rx="2"/>
    <rect class="bar b10" x="64"  y="46" width="8" height="28" rx="2"/>
    <rect class="bar b3"  x="78"  y="50" width="8" height="20" rx="2"/>
    <rect class="bar b7"  x="92"  y="51" width="8" height="18" rx="2"/>
    <rect class="bar b1"  x="106" y="56" width="8" height="8"  rx="2"/>
    <rect class="bar b8"  x="120" y="48" width="8" height="24" rx="2"/>
    <rect class="bar b4"  x="134" y="55" width="8" height="10" rx="2"/>
    <rect class="bar b6"  x="148" y="57" width="8" height="6"  rx="2"/>
    <rect class="bar b2"  x="162" y="53" width="8" height="14" rx="2"/>
    <rect class="bar b9"  x="176" y="54" width="8" height="12" rx="2"/>

    <!-- Right bars (mirror) -->
    <rect class="bar b9"  x="616" y="54" width="8" height="12" rx="2"/>
    <rect class="bar b2"  x="630" y="53" width="8" height="14" rx="2"/>
    <rect class="bar b6"  x="644" y="57" width="8" height="6"  rx="2"/>
    <rect class="bar b4"  x="658" y="55" width="8" height="10" rx="2"/>
    <rect class="bar b8"  x="672" y="48" width="8" height="24" rx="2"/>
    <rect class="bar b1"  x="686" y="56" width="8" height="8"  rx="2"/>
    <rect class="bar b7"  x="700" y="51" width="8" height="18" rx="2"/>
    <rect class="bar b3"  x="714" y="50" width="8" height="20" rx="2"/>
    <rect class="bar b10" x="728" y="46" width="8" height="28" rx="2"/>
    <rect class="bar b5"  x="742" y="45" width="8" height="30" rx="2"/>
  </g>

  <!-- Center Logo Text -->
  <text
    x="400" y="55"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="36"
    font-weight="bold"
    letter-spacing="12"
    fill="#00ff41"
    filter="url(#glow-filter)"
  >SYNC<tspan fill="#ffffff">WAVE</tspan></text>

  <!-- Tagline -->
  <text
    x="400" y="80"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    letter-spacing="6"
    fill="#004400"
  >REAL-TIME · SYNCHRONIZED · STREAMING</text>
</svg>
